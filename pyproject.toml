[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tourgrid-studio"
version = "0.3.0"
description = "Unofficial browser-based editor and immutable work sharing service for Arknights exhibition pixel art."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.9,<3",
  "Pillow>=10,<13",
  "playwright>=1.50,<2",
  "pytest>=8,<10",
]
monitoring = [
  "sentry-sdk[fastapi]>=2,<3",
]

[project.scripts]
tourgrid-api = "backend.api.app:run"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "browser: runs the real Chromium frontend regression suite",
  "integration: requires an explicitly configured external service",
]
