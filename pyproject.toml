[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# This metadata supports dependency tooling and editable source checkouts.
# Built wheel artifacts are not a supported runtime distribution.
name = "tourgrid-studio"
version = "0.3.2"
description = "Source-only browser-based 24x24 pixel art editor and immutable work sharing service."
readme = "README.md"
license = "Apache-2.0"
license-files = [
  "LICENSE",
  "NOTICE",
  "LICENSE_SCOPE.md",
  "THIRD_PARTY_NOTICES.md",
]
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "redis>=6,<9",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.9,<3",
  "Pillow>=10,<13",
  "playwright>=1.50,<2",
  "pytest>=8,<10",
]
monitoring = [
  "sentry-sdk[fastapi]>=2,<3",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "browser: runs the real Chromium frontend regression suite",
  "integration: requires an explicitly configured external service",
  "postgres_store: directly tests the PostgreSQL work store without HTTP",
]
