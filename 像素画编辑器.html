// --- 閺囧瓨鏌婇悽璇茬鐏忓搫顕敍鍫滅矌閺囧瓨鏌婇崘鍛村劥閸掑棜椴搁悳鍥风礉CSS鐏忓搫顕捄鐔兼閸愬懎顔愰懛顏堚偓鍌氱安閿?--
function updateCanvasSize() {
  const cellSize = BASE_CELL_SIZE * (zoom / 100);
  const canvasPixelSize = GRID_SIZE * cellSize;
  mainCanvas.width = canvasPixelSize;
  mainCanvas.height = canvasPixelSize;
  // 娑撳秴鍟€鐠佸墽鐤咰SS鐎逛粙鐝敍瀹慳nvas娴犮儱甯慨瀣瀻鏉堛劎宸煎〒鍙夌厠閿涘苯顔愰崳鈺玽erflow閹貉冨煑閸欘垵顫嗛崠鍝勭厵
}

// --- 濞撳弶鐓嬫稉鑽ゆ暰鐢?---
function renderCanvas() {
  const cellSize = BASE_CELL_SIZE * (zoom / 100);
  const w = GRID_SIZE * cellSize;
  const h = GRID_SIZE * cellSize;

  mainCanvas.width = w;
  mainCanvas.height = h;
  // CSS鐏忓搫顕悽鐪俛nvas閸愬懘鍎撮崚鍡氶哺閻滃洩鍤滈悞璺哄枀鐎规熬绱濈€圭懓娅抩verflow鐟佷礁澹€

  mainCtx.clearRect(0, 0, w, h);

  // 缂佹ê鍩楅惂鍊熷閼冲本娅?
  mainCtx.fillStyle = '#FFFFFF';
  mainCtx.fillRect(0, 0, w, h);

  // grid lines
  for (let y = 0; y < GRID_SIZE; y++) {
    for (let x = 0; x < GRID_SIZE; x++) {
      const color = pixelData[y][x];
      if (color !== '#FFFFFF') {
        mainCtx.fillStyle = color;
        mainCtx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
      }
    }
  }

  // grid style
  mainCtx.strokeStyle = '#E8E8E8';
  mainCtx.lineWidth = 0.5;
  for (let x = 0; x <= GRID_SIZE; x++) {
    mainCtx.beginPath();
    mainCtx.moveTo(x * cellSize, 0);
    mainCtx.lineTo(x * cellSize, h);
    mainCtx.stroke();
  }
  for (let y = 0; y <= GRID_SIZE; y++) {
    mainCtx.beginPath();
    mainCtx.moveTo(0, y * cellSize);
    mainCtx.lineTo(w, y * cellSize);
    mainCtx.stroke();
  }

  // 官方模式: 像素格上显示色号 (cellSize≥14px时才可读)
  if (paletteMode === 'official' && cellSize >= 14) {
    var fontSize = Math.max(6, Math.min(Math.floor(cellSize * 0.42), 10));
    mainCtx.font = 'bold ' + fontSize + 'px "Consolas", "Courier New", monospace';
    mainCtx.textAlign = 'center';
    mainCtx.textBaseline = 'middle';
    mainCtx.shadowColor = 'rgba(0,0,0,0.75)';
    mainCtx.shadowBlur = Math.max(1, cellSize * 0.12);
    mainCtx.fillStyle = '#fff';

    for (var cy = 0; cy < GRID_SIZE; cy++) {
      for (var cx = 0; cx < GRID_SIZE; cx++) {
        var color = pixelData[cy][cx];
        if (color === '#FFFFFF') continue;
        var code = hexToCodeMap[color];
        if (code) {
          var textX = cx * cellSize + cellSize / 2;
          var textY = cy * cellSize + cellSize / 2;
          mainCtx.fillText(code, textX, textY);
        }
      }
    }

    // 重置阴影
    mainCtx.shadowColor = 'transparent';
    mainCtx.shadowBlur = 0;
  }

  renderOverlay();
  gridInfoEl.textContent = `${GRID_SIZE} × ${GRID_SIZE} px  |  缩放 ${zoom}%`;
}

// --- 濞撳弶鐓嬬€佃壈鍩呴崳銊╊暕鐟?---
function renderNavigator() {
  // 读取容器实际尺寸(对齐下方控件宽度)
  var wrap = navCanvas.parentElement;
  var size = wrap.clientWidth || 128;
  navCanvas.width = size;
  navCanvas.height = size;

  navCtx.clearRect(0, 0, size, size);

  // nav mode check
  if (navShowOriginal && importedPreviewImage && importedPreviewImage.complete) {
    navCtx.fillStyle = '#FFFFFF';
    navCtx.fillRect(0, 0, size, size);
    navCtx.imageSmoothingEnabled = true;
    navCtx.imageSmoothingQuality = 'medium';
    navCtx.drawImage(importedPreviewImage, 0, 0, size, size);
    navCtx.imageSmoothingEnabled = false;
  } else {
    navCtx.fillStyle = '#FFFFFF';
    navCtx.fillRect(0, 0, size, size);

    const navCellSize = size / GRID_SIZE;
    for (let y = 0; y < GRID_SIZE; y++) {
      for (let x = 0; x < GRID_SIZE; x++) {
        const color = pixelData[y][x];
        if (color !== '#FFFFFF') {
          navCtx.fillStyle = color;
          navCtx.fillRect(x * navCellSize, y * navCellSize, navCellSize, navCellSize);
        }
      }
    }
  }
}

// --- 閼惧嘲褰囬悽璇茬閸ф劖鐖ｇ€电懓绨查惃鍕剼缁辩姵鐗?---
function getGridPos(e) {
  const rect = mainCanvas.getBoundingClientRect();
  const cellSize = BASE_CELL_SIZE * (zoom / 100);
  // getBoundingClientRect瀹告彃瀵橀崥顐ｇ泊scroll offset
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const gx = Math.floor(mx / cellSize);
  const gy = Math.floor(my / cellSize);
  return { x: gx, y: gy };
}

// --- 缂佹ê鍩楅崡鏇氶嚋閸嶅繒绀?---
function paintPixel(gx, gy) {
  if (gx < 0 || gx >= GRID_SIZE || gy < 0 || gy >= GRID_SIZE) return;
  if (gx === lastPaintedX && gy === lastPaintedY) return;

  const color = currentTool === 'eraser' ? '#FFFFFF' : currentColor;
  if (pixelData[gy][gx] === color) return;

  pixelData[gy][gx] = color;
  lastPaintedX = gx;
  lastPaintedY = gy;
}

// --- 姒х姵鐖ｆ禍瀣╂ ---
function onMouseDown(e) {
  if (e.button !== 0) return; // 閸欘亜鎼锋惔鏂夸箯闁?
  // 缁岀儤鐗?瀹革箓鏁?閳?閹锋牗瀚块獮宕囆?
  if (spaceHeld) {
    isPanning = true;
    panStartX = e.clientX;
    panStartY = e.clientY;
    panScrollStartX = canvasContainer.scrollLeft;
    panScrollStartY = canvasContainer.scrollTop;
    mainCanvas.style.cursor = 'grabbing';
    return;
  }

  // inspect mode
  if (currentTool === 'inspect') {
    const pos = getGridPos(e);
    inspectPixel(pos.x, pos.y);
    return;
  }

  isDrawing = true;
  pushUndo();
  lastPaintedX = -1;
  lastPaintedY = -1;
  const pos = getGridPos(e);
  paintPixel(pos.x, pos.y);
  renderCanvas();
  renderNavigator();
}

function onMouseMove(e) {
  if (!isDrawing || currentTool === 'inspect') return;
  const pos = getGridPos(e);
  paintPixel(pos.x, pos.y);
  renderCanvas();
  renderNavigator();
}

function onMouseUp(e) {
  // 缂佹挻娼粚鐑樼壐閹锋牗瀚?
  if (isPanning && spaceHeld) {
    isPanning = false;
    mainCanvas.style.cursor = 'grab';
    return;
  }
  if (isDrawing) {
    isDrawing = false;
    lastPaintedX = -1;
    lastPaintedY = -1;
    renderColorGrid();
    saveToStorage(true);
  }
}

// --- 濠婃俺鐤嗙紓鈺傛杹閿涘牅浜掓Η鐘崇垼娴ｅ秶鐤嗘稉杞拌厬韫囧喛绱?--
function onWheel(e) {
  e.preventDefault();
  const rect = canvasContainer.getBoundingClientRect();
  const mx = e.clientX - rect.left + canvasContainer.scrollLeft;
  const my = e.clientY - rect.top + canvasContainer.scrollTop;

  const oldCellSize = BASE_CELL_SIZE * (zoom / 100);
  const oldContentSize = GRID_SIZE * oldCellSize;
  const ratioX = oldContentSize > 0 ? mx / oldContentSize : 0.5;
  const ratioY = oldContentSize > 0 ? my / oldContentSize : 0.5;

  var minZoom = getMinZoom();
  const delta = e.deltaY > 0 ? -10 : 10;
  const newZoom = Math.max(minZoom, Math.min(300, zoom + delta));
  if (newZoom === zoom) return;

  zoom = newZoom;
  updateCanvasSize();
  renderCanvas();

  const newContentSize = GRID_SIZE * BASE_CELL_SIZE * (zoom / 100);
  if (zoom === minZoom) {
    // 最小缩放时自动居中
    canvasContainer.scrollLeft = 0;
    canvasContainer.scrollTop = 0;
  } else {
    canvasContainer.scrollLeft = ratioX * newContentSize - (e.clientX - rect.left);
    canvasContainer.scrollTop  = ratioY * newContentSize - (e.clientY - rect.top);
  }

  document.getElementById('zoomSlider').value = zoom;
  document.getElementById('zoomValue').textContent = zoom + '%';
}

// --- 娑擃參鏁幏鏍ㄥ楠炲磭些 ---
function onPanStart(e) {
  if (e.button === 1) {
    e.preventDefault();
    isPanning = true;
    panStartX = e.clientX;
    panStartY = e.clientY;
    panScrollStartX = canvasContainer.scrollLeft;
    panScrollStartY = canvasContainer.scrollTop;
    canvasContainer.style.cursor = 'grabbing';
  }
}

function onPanMove(e) {
  if (!isPanning) return;
  // 缁岀儤鐗?瀹革箓鏁幏鏍ㄥ
  if (spaceHeld && e.buttons === 1) {
    canvasContainer.scrollLeft = panScrollStartX - (e.clientX - panStartX);
    canvasContainer.scrollTop  = panScrollStartY - (e.clientY - panStartY);
    return;
  }
  // 娑擃參鏁幏鏍ㄥ
  if (e.buttons === 4) {
    canvasContainer.scrollLeft = panScrollStartX - (e.clientX - panStartX);
    canvasContainer.scrollTop  = panScrollStartY - (e.clientY - panStartY);
  }
}

function onPanEnd(e) {
  if (!isPanning) return;
  if (e.button === 1 || (spaceHeld && e.button === 0)) {
    isPanning = false;
    canvasContainer.style.cursor = spaceHeld ? 'grab' : '';
    mainCanvas.style.cursor = spaceHeld ? 'grab' : 'crosshair';
  }
}

// --- 触摸事件（支持单指绘制 + 双指平移）---
var touchPanStart = null; // {x, y, scrollLeft, scrollTop}
var touchPinchDist = 0;   // 双指初始距离（用于缩放判定）
var touchPinchZoom = 0;   // 双指缩放起始zoom值

function onTouchStart(e) {
  e.preventDefault();
  if (e.touches.length === 1) {
    // 单指：绘制或吸管
    if (currentTool === 'inspect') {
      const pos = getGridPos(e.touches[0]);
      inspectPixel(pos.x, pos.y);
      return;
    }
    isDrawing = true;
    pushUndo();
    lastPaintedX = -1;
    lastPaintedY = -1;
    const pos = getGridPos(e.touches[0]);
    paintPixel(pos.x, pos.y);
    renderCanvas();
    renderNavigator();
  } else if (e.touches.length === 2) {
    // 双指：平移+缩放
    isDrawing = false;
    var mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    var my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    var dx = e.touches[0].clientX - e.touches[1].clientX;
    var dy = e.touches[0].clientY - e.touches[1].clientY;
    touchPanStart = {
      x: mx, y: my,
      scrollLeft: canvasContainer.scrollLeft,
      scrollTop: canvasContainer.scrollTop
    };
    touchPinchDist = Math.sqrt(dx * dx + dy * dy);
    touchPinchZoom = zoom;
  }
}

function onTouchMove(e) {
  e.preventDefault();
  if (isDrawing && e.touches.length === 1) {
    const pos = getGridPos(e.touches[0]);
    paintPixel(pos.x, pos.y);
    renderCanvas();
    renderNavigator();
  } else if (e.touches.length === 2 && touchPanStart) {
    var mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    var my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    var dx = e.touches[0].clientX - e.touches[1].clientX;
    var dy = e.touches[0].clientY - e.touches[1].clientY;
    var newDist = Math.sqrt(dx * dx + dy * dy);

    // 距离变化>3px → 缩放；否则平移
    if (touchPinchDist > 0 && Math.abs(newDist - touchPinchDist) > 3) {
      var ratio = newDist / touchPinchDist;
      var newZoom = Math.round(touchPinchZoom * ratio);
      newZoom = Math.max(20, Math.min(300, newZoom));
      if (newZoom !== zoom) {
        // 以双指中点为中心缩放：调整滚动位置
        var rect = canvasContainer.getBoundingClientRect();
        var cx = mx - rect.left + canvasContainer.scrollLeft;
        var cy = my - rect.top + canvasContainer.scrollTop;
        var oldCell = BASE_CELL_SIZE * (zoom / 100);
        var oldCx = cx / oldCell;
        var oldCy = cy / oldCell;
        setZoom(newZoom);
        var newCell = BASE_CELL_SIZE * (zoom / 100);
        canvasContainer.scrollLeft = oldCx * newCell - (mx - rect.left);
        canvasContainer.scrollTop  = oldCy * newCell - (my - rect.top);
        // 更新基准值，避免跳跃
        touchPinchDist = newDist;
        touchPinchZoom = zoom;
        touchPanStart.scrollLeft = canvasContainer.scrollLeft;
        touchPanStart.scrollTop = canvasContainer.scrollTop;
        touchPanStart.x = mx;
        touchPanStart.y = my;
      }
    } else {
      // 平移
      canvasContainer.scrollLeft = touchPanStart.scrollLeft + (touchPanStart.x - mx);
      canvasContainer.scrollTop  = touchPanStart.scrollTop  + (touchPanStart.y - my);
    }
  }
}

function onTouchEnd(e) {
  if (isDrawing) {
    isDrawing = false;
    lastPaintedX = -1;
    lastPaintedY = -1;
    renderColorGrid();
    saveToStorage(true);
  }
  touchPanStart = null;
  touchPinchDist = 0;
  touchPinchZoom = 0;
  if (isPanning) {
    isPanning = false;
    mainCanvas.style.cursor = 'grab';
  }
}

// --- 閹俱倝鏀?闁插秴浠?---
function pushUndo() {
  const snapshot = pixelData.map(row => [...row]);
  undoStack.push(snapshot);
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  redoStack = []; // 閺傜増鎼锋担婊勭缁屾椽鍣搁崑姘垽
}

function undo() {
  if (undoStack.length <= 1) {
    showToast('Nothing to undo');
    return;
  }
  // 娣囨繂鐡ㄨぐ鎾冲閻㈠娼伴崚浼村櫢閸嬫碍鐖ら敍鍫㈢帛閸掕泛鎮楅惃鍕波閺嬫粣绱?
  redoStack.push(pixelData.map(row => [...row]));
  // 瀵懓鍤張鈧潻鎴滅// pop undo
  undoStack.pop();
  const prev = undoStack[undoStack.length - 1];
  pixelData = prev.map(row => [...row]);
  renderCanvas();
  renderNavigator();
  renderColorGrid();
  saveToStorage(true);
  showToast('Undone');
}

function redo() {
  if (redoStack.length === 0) {
    showToast('Nothing to redo');
    return;
  }
  // push snapshot
  undoStack.push(pixelData.map(row => [...row]));
  // restore redo
  const next = redoStack.pop();
  pixelData = next.map(row => [...row]);
  renderCanvas();
  renderNavigator();
  renderColorGrid();
  saveToStorage(true);
  showToast('Redone');
}

// --- 濞撳懐鈹栭悽璇茬 ---
function clearCanvas() {
  if (!confirm('Clear canvas? This can be undone.')) return;
  pushUndo();
  pixelData = Array.from({ length: GRID_SIZE }, () =>
    Array.from({ length: GRID_SIZE }, () => '#FFFFFF')
  );
  renderCanvas();
  renderNavigator();
  renderColorGrid();
  clearStorage();
  showToast('Canvas cleared (Ctrl+Z to undo)');
}

// --- 娣囨繂鐡ㄩ崶鍓у ---
function saveImage() {
  var BOARD = 26;
  var exportScale = 16;
  var boardSize = BOARD * exportScale; // 26×16 = 416px

  var boardsX = Math.ceil(GRID_SIZE / BOARD);
  var boardsY = Math.ceil(GRID_SIZE / BOARD);

  // 生成时间戳: "26.7.26_06.46"
  var now = new Date();
  var ts = (''+now.getFullYear()).slice(2) + '.' + (now.getMonth()+1) + '.' + now.getDate() + '_' +
           ('0'+now.getHours()).slice(-2) + '.' + ('0'+now.getMinutes()).slice(-2);

  var idx = 0;
  for (var by = 0; by < boardsY; by++) {
    for (var bx = 0; bx < boardsX; bx++) {
      idx++;
      var offCanvas = document.createElement('canvas');
      offCanvas.width = boardSize;
      offCanvas.height = boardSize;
      var offCtx = offCanvas.getContext('2d');

      // 白底
      offCtx.fillStyle = '#FFFFFF';
      offCtx.fillRect(0, 0, boardSize, boardSize);

      // 绘制本板像素
      for (var y = 0; y < BOARD; y++) {
        for (var x = 0; x < BOARD; x++) {
          var srcX = bx * BOARD + x;
          var srcY = by * BOARD + y;
          offCtx.fillStyle = (srcX < GRID_SIZE && srcY < GRID_SIZE) ? pixelData[srcY][srcX] : '#FFFFFF';
          offCtx.fillRect(x * exportScale, y * exportScale, exportScale, exportScale);
        }
      }

      var link = document.createElement('a');
      link.download = ts + '_' + idx + '.png';
      link.href = offCanvas.toDataURL('image/png');
      link.click();
    }
  }

  showToast('已导出 ' + idx + ' 张图片 (' + boardsX + '×' + boardsY + ')');
}

// --- 导出下拉 ---
function toggleExportDropdown(e) {
  if (e) e.stopPropagation();
  var dd = document.getElementById('exportDropdown');
  var beadBtn = document.getElementById('exportBeadBtn');
  var warning = document.getElementById('exportWarning');

  if (dd.classList.contains('show')) {
    dd.classList.remove('show');
    return;
  }

  // 检查是否为拼豆色卡模式
  if (paletteMode === 'official') {
    beadBtn.style.display = 'flex';
    warning.style.display = 'none';
  } else {
    beadBtn.style.display = 'none';
    warning.style.display = 'block';
  }

  // 根据按钮位置定位下拉框（使用元素实际宽度，避免硬编码）
  var btn = e.currentTarget;
  var rect = btn.getBoundingClientRect();
  var ddWidth = dd.offsetWidth || 220;
  dd.style.top = (rect.bottom + 4) + 'px';
  // 右侧对齐按钮，但不超出屏幕
  var left = rect.right - ddWidth;
  if (left < 4) left = 4;
  if (left + ddWidth > window.innerWidth - 4) left = window.innerWidth - ddWidth - 4;
  dd.style.left = left + 'px';

  dd.classList.add('show');
}

function hideExportDropdown() {
  var dd = document.getElementById('exportDropdown');
  if (dd) dd.classList.remove('show');
}

function exportPixelImage() {
  hideExportDropdown();
  saveImage();
}

function exportBeadBlueprint() {
  hideExportDropdown();

  var BOARD = 26;  // 标准拼板尺寸
  var A4_W = 2480, A4_H = 3508;
  var MARGIN = 100;

  // ---- 按BOARD(26)计算单元格大小（A4宽度）----
  var availW = A4_W - MARGIN * 2;
  var CELL = Math.floor(availW / (BOARD + 1.4));
  var LABEL = Math.max(34, Math.round(CELL * 0.80));
  CELL = Math.floor((availW - LABEL * 2) / BOARD);
  var FONT_SZ = Math.max(6, Math.round(CELL * 0.22));
  var CIRCLE_R = Math.max(5, Math.floor(CELL * 0.38));

  // ---- 将全部像素映射到最近官方色板颜色（全局映射）----
  var paletteRGB = OFFICIAL_COLORS.map(function(e) {
    var h = paletteHex(e);
    return {
      hex: h,
      code: paletteCode(e),
      r: parseInt(h.slice(1,3), 16),
      g: parseInt(h.slice(3,5), 16),
      b: parseInt(h.slice(5,7), 16)
    };
  });

  var beadMap = [];  // [y][x] = {hex, code}
  for (var y = 0; y < GRID_SIZE; y++) {
    beadMap[y] = [];
    for (var x = 0; x < GRID_SIZE; x++) {
      var px = pixelData[y][x];
      var r = parseInt(px.slice(1,3), 16);
      var g = parseInt(px.slice(3,5), 16);
      var b = parseInt(px.slice(5,7), 16);
      var best = paletteRGB[0], bestD = Infinity;
      for (var i = 0; i < paletteRGB.length; i++) {
        var d = colorDistRGB(r, g, b, paletteRGB[i].r, paletteRGB[i].g, paletteRGB[i].b);
        if (d < bestD) { bestD = d; best = paletteRGB[i]; }
      }
      beadMap[y][x] = best;
    }
  }

  // ---- 全局颜色统计（用于full总览 + 每板显示"板/总"）----
  var globalColorUsed = {};
  var globalColorList = [];
  for (var y = 0; y < GRID_SIZE; y++) {
    for (var x = 0; x < GRID_SIZE; x++) {
      var cell = beadMap[y][x];
      if (!globalColorUsed[cell.hex]) {
        globalColorUsed[cell.hex] = { hex: cell.hex, code: cell.code, count: 0 };
        globalColorList.push(globalColorUsed[cell.hex]);
      }
      globalColorUsed[cell.hex].count++;
    }
  }
  globalColorList.sort(function(a, b) {
    return (a.code || '').localeCompare(b.code || '', undefined, {numeric: true});
  });
  var globalTotal = 0;
  for (var i = 0; i < globalColorList.length; i++) {
    globalTotal += globalColorList[i].count;
  }
  // hex→全局数量查表
  var hexToGlobalCount = {};
  for (var i = 0; i < globalColorList.length; i++) {
    hexToGlobalCount[globalColorList[i].hex] = globalColorList[i].count;
  }

  // 时间戳: "26.7.26_06.46"
  var now = new Date();
  var ts = (''+now.getFullYear()).slice(2) + '.' + (now.getMonth()+1) + '.' + now.getDate() + '_' +
           ('0'+now.getHours()).slice(-2) + '.' + ('0'+now.getMinutes()).slice(-2);

  // 获取当前色板品牌名
  var paletteLabel = '';
  for (var pi = 0; pi < PALETTE_DEFS.length; pi++) {
    if (PALETTE_DEFS[pi].id === currentPaletteId) { paletteLabel = PALETTE_DEFS[pi].label; break; }
  }

  // ========== 1. 导出整体总览图 (_full) ==========
  (function() {
    // 根据GRID_SIZE计算单元格
    var fullCELL = Math.floor(availW / (GRID_SIZE + 1.4));
    var fullLABEL = Math.max(34, Math.round(fullCELL * 0.80));
    fullCELL = Math.floor((availW - fullLABEL * 2) / GRID_SIZE);
    var fullFONT = Math.max(5, Math.round(fullCELL * 0.22));
    var fullCR = Math.max(4, Math.floor(fullCELL * 0.38));
    var showText = fullCELL >= 28;
    var fullGridW = GRID_SIZE * fullCELL;
    var fullGridH = GRID_SIZE * fullCELL;

    // 图例（2.5倍大）
    var fLegCols = globalColorList.length <= 6 ? 2 : (globalColorList.length <= 15 ? 3 : 4);
    var fLegRows = Math.ceil(globalColorList.length / fLegCols);
    var fOriginX = Math.floor((A4_W - (fullLABEL + fullGridW + fullLABEL)) / 2);
    var fOriginY = MARGIN;

    var cvs = document.createElement('canvas');
    cvs.width = A4_W; cvs.height = A4_H;
    var ctx = cvs.getContext('2d');
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, A4_W, A4_H);

    var fLeft = fOriginX + fullLABEL;
    var fTop = fOriginY + fullLABEL;

    // 标题
    ctx.fillStyle = '#333';
    ctx.font = 'bold 28px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';
    ctx.fillText('总览  ' + GRID_SIZE + '×' + GRID_SIZE, fOriginX, fOriginY - 40);

    // 坐标轴
    var axisFont = Math.max(11, Math.round(fullFONT * 1.5));
    ctx.fillStyle = '#333';
    ctx.font = 'bold ' + axisFont + 'px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var showEvery = GRID_SIZE > 60 ? 10 : (GRID_SIZE > 30 ? 5 : 1);
    for (var x = 0; x < GRID_SIZE; x++) {
      if (x % showEvery === 0) {
        ctx.fillText(x + 1, fLeft + x * fullCELL + fullCELL/2, fOriginY + fullLABEL/2);
        ctx.fillText(x + 1, fLeft + x * fullCELL + fullCELL/2, fTop + fullGridH + fullLABEL/2);
      }
    }
    ctx.textAlign = 'right';
    for (var y = 0; y < GRID_SIZE; y++) {
      if (y % showEvery === 0) {
        ctx.fillText(y + 1, fLeft - 12, fTop + y * fullCELL + fullCELL/2);
      }
    }
    ctx.textAlign = 'left';
    for (var y = 0; y < GRID_SIZE; y++) {
      if (y % showEvery === 0) {
        ctx.fillText(y + 1, fLeft + fullGridW + 12, fTop + y * fullCELL + fullCELL/2);
      }
    }

    // 单元格
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var y = 0; y < GRID_SIZE; y++) {
      for (var x = 0; x < GRID_SIZE; x++) {
        var gx = fLeft + x * fullCELL;
        var gy = fTop + y * fullCELL;
        var cell = beadMap[y][x];
        ctx.fillStyle = cell.hex;
        ctx.fillRect(gx, gy, fullCELL, fullCELL);
        if (showText) {
          var ccx = gx + fullCELL/2, ccy = gy + fullCELL/2;
          ctx.fillStyle = '#FFFFFF';
          ctx.beginPath(); ctx.arc(ccx, ccy, fullCR + 1.5, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = cell.hex;
          ctx.beginPath(); ctx.arc(ccx, ccy, fullCR, 0, Math.PI*2); ctx.fill();
          ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 0.5; ctx.stroke();
          var rr2 = parseInt(cell.hex.slice(1,3), 16);
          var gg2 = parseInt(cell.hex.slice(3,5), 16);
          var bb2 = parseInt(cell.hex.slice(5,7), 16);
          ctx.fillStyle = (0.299*rr2+0.587*gg2+0.114*bb2) > 140 ? '#000' : '#FFF';
          ctx.font = 'bold ' + fullFONT + 'px monospace';
          ctx.fillText(cell.code || '', ccx, ccy);
        }
      }
    }

    // 网格线
    ctx.strokeStyle = '#CCC'; ctx.lineWidth = 0.5;
    for (var x = 0; x <= GRID_SIZE; x++) {
      ctx.beginPath(); ctx.moveTo(fLeft + x*fullCELL, fTop); ctx.lineTo(fLeft + x*fullCELL, fTop + fullGridH); ctx.stroke();
    }
    for (var y = 0; y <= GRID_SIZE; y++) {
      ctx.beginPath(); ctx.moveTo(fLeft, fTop + y*fullCELL); ctx.lineTo(fLeft + fullGridW, fTop + y*fullCELL); ctx.stroke();
    }

    // 图例 (2.5倍)
    var fLegX = fOriginX + fullLABEL;
    var fLegY = fTop + fullGridH + fullLABEL + 100;
    var fLegAvail = fullGridW + fullLABEL;
    var fColW = Math.floor(fLegAvail / fLegCols);
    var fRowH = 65;
    ctx.fillStyle = '#333';
    ctx.font = 'bold 42px sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText('材料清单：' + paletteLabel + '（总览）', fLegX, fLegY);
    fLegY += 60;
    ctx.textBaseline = 'top';
    for (var i = 0; i < globalColorList.length; i++) {
      var col = i % fLegCols;
      var row = Math.floor(i / fLegCols);
      var ex = fLegX + col * fColW;
      var ey = fLegY + row * fRowH;
      var c = globalColorList[i];
      ctx.fillStyle = c.hex;
      ctx.fillRect(ex, ey + 3, 50, 40);
      ctx.strokeStyle = '#999'; ctx.lineWidth = 0.5;
      ctx.strokeRect(ex, ey + 3, 50, 40);
      ctx.fillStyle = '#333';
      ctx.font = '30px monospace';
      ctx.textAlign = 'left';
      ctx.fillText(c.code + '  ×' + c.count, ex + 58, ey + 3);
    }
    // 材料清单条目结束，总计锚定底部
    var fTotalY = A4_H - MARGIN;
    ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(fLegX, fTotalY - 55); ctx.lineTo(fLegX + fLegAvail, fTotalY - 55); ctx.stroke();
    ctx.fillStyle = '#333';
    ctx.font = 'bold 38px sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.fillText('总计: ' + globalTotal + ' 颗  |  色数: ' + globalColorList.length + '  |  拼板: ' +
      Math.ceil(GRID_SIZE/BOARD) + '×' + Math.ceil(GRID_SIZE/BOARD), fLegX, fTotalY);

    var link = document.createElement('a');
    link.download = ts + '_full.png';
    link.href = cvs.toDataURL('image/png');
    link.click();
  })();

  // ========== 2. 分板导出（仅当需要多板时）==========
  var boardsX = Math.ceil(GRID_SIZE / BOARD);
  var boardsY = Math.ceil(GRID_SIZE / BOARD);
  var totalBoards = boardsX * boardsY;

  if (totalBoards > 1) {
    var gridW = BOARD * CELL;
    var gridH = BOARD * CELL;

    var idx = 0;
    for (var by = 0; by < boardsY; by++) {
    for (var bx = 0; bx < boardsX; bx++) {
      idx++;

      // ---- 提取本板数据 ----
      var boardBeadMap = [];
      var boardColorUsed = {};
      var boardColorList = [];

      for (var y = 0; y < BOARD; y++) {
        boardBeadMap[y] = [];
        for (var x = 0; x < BOARD; x++) {
          var srcX = bx * BOARD + x;
          var srcY = by * BOARD + y;
          if (srcX < GRID_SIZE && srcY < GRID_SIZE) {
            var cell = beadMap[srcY][srcX];
            boardBeadMap[y][x] = cell;
            if (!boardColorUsed[cell.hex]) {
              boardColorUsed[cell.hex] = { hex: cell.hex, code: cell.code, count: 0 };
              boardColorList.push(boardColorUsed[cell.hex]);
            }
            boardColorUsed[cell.hex].count++;
          } else {
            boardBeadMap[y][x] = null; // 空白格
          }
        }
      }

      // 按色号排序
      boardColorList.sort(function(a, b) {
        return (a.code || '').localeCompare(b.code || '', undefined, {numeric: true});
      });
      var boardTotal = 0;
      for (var i = 0; i < boardColorList.length; i++) {
        boardTotal += boardColorList[i].count;
      }

      // ---- 图例布局 (2.5倍) ----
      var legendCols = boardColorList.length <= 4 ? 2 : (boardColorList.length <= 10 ? 3 : 4);
      var legendRows = Math.ceil(boardColorList.length / legendCols);
      var LEG_ROW_H = 65;

      // ---- 创建A4画布 ----
      var originX = Math.floor((A4_W - (LABEL + gridW + LABEL)) / 2);
      var originY = MARGIN;

      var offCanvas = document.createElement('canvas');
      offCanvas.width = A4_W;
      offCanvas.height = A4_H;
      var ctx = offCanvas.getContext('2d');

      // 白底
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, A4_W, A4_H);

      // 辅助
      function isLight(hex) {
        var rr = parseInt(hex.slice(1,3), 16);
        var gg = parseInt(hex.slice(3,5), 16);
        var bb = parseInt(hex.slice(5,7), 16);
        return (0.299 * rr + 0.587 * gg + 0.114 * bb) > 140;
      }

      var gLeft = originX + LABEL;
      var gTop  = originY + LABEL;

      // 本板绝对坐标起始值（1-based）
      var absX0 = bx * BOARD + 1;
      var absY0 = by * BOARD + 1;

      // ---- 板号标题 ----
      ctx.fillStyle = '#333';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'bottom';
      ctx.fillText('板 ' + idx + '/' + totalBoards, originX, originY - 15);

      // ---- 列号（顶部）----
      ctx.fillStyle = '#333';
      ctx.font = 'bold ' + Math.max(11, Math.round(FONT_SZ * 1.3)) + 'px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (var x = 0; x < BOARD; x++) {
        var cx = gLeft + x * CELL + CELL / 2;
        ctx.fillText(absX0 + x, cx, originY + LABEL / 2);
      }

      // ---- 行号（左侧）----
      ctx.textAlign = 'right';
      for (var y = 0; y < BOARD; y++) {
        var ry = gTop + y * CELL + CELL / 2;
        ctx.fillText(absY0 + y, gLeft - 12, ry);
      }

      // ---- 列号（底部）----
      ctx.textAlign = 'center';
      var bottomY = gTop + gridH + LABEL / 2;
      for (var x = 0; x < BOARD; x++) {
        ctx.fillText(absX0 + x, gLeft + x * CELL + CELL / 2, bottomY);
      }

      // ---- 行号（右侧）----
      ctx.textAlign = 'left';
      var rightX = gLeft + gridW + 12;
      for (var y = 0; y < BOARD; y++) {
        ctx.fillText(absY0 + y, rightX, gTop + y * CELL + CELL / 2);
      }

      // ---- 单元格 ----
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (var y = 0; y < BOARD; y++) {
        for (var x = 0; x < BOARD; x++) {
          var gx = gLeft + x * CELL;
          var gy = gTop + y * CELL;
          var cell = boardBeadMap[y][x];

          if (cell) {
            var ccx = gx + CELL / 2;
            var ccy = gy + CELL / 2;
            var cr = CIRCLE_R;
            var code = cell.code || '';

            ctx.fillStyle = cell.hex;
            ctx.fillRect(gx, gy, CELL, CELL);

            // 白色底圆
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(ccx, ccy, cr + 1.5, 0, Math.PI * 2);
            ctx.fill();

            // 色圆
            ctx.fillStyle = cell.hex;
            ctx.beginPath();
            ctx.arc(ccx, ccy, cr, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.25)';
            ctx.lineWidth = 0.5;
            ctx.stroke();

            // 色号
            ctx.fillStyle = isLight(cell.hex) ? '#000' : '#FFF';
            ctx.font = 'bold ' + FONT_SZ + 'px monospace';
            ctx.fillText(code, ccx, ccy);
          } else {
            // 空白格（超出画布范围）
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(gx, gy, CELL, CELL);
          }
        }
      }

      // ---- 网格线 ----
      ctx.strokeStyle = '#CCC';
      ctx.lineWidth = 0.5;
      for (var x = 0; x <= BOARD; x++) {
        ctx.beginPath();
        ctx.moveTo(gLeft + x * CELL, gTop);
        ctx.lineTo(gLeft + x * CELL, gTop + gridH);
        ctx.stroke();
      }
      for (var y = 0; y <= BOARD; y++) {
        ctx.beginPath();
        ctx.moveTo(gLeft, gTop + y * CELL);
        ctx.lineTo(gLeft + gridW, gTop + y * CELL);
        ctx.stroke();
      }

      // ---- 图例/材料清单 (2.5倍) ----
      var legX = originX + LABEL;
      var legY = gTop + gridH + LABEL + 100;
      var legAvailW = gridW + LABEL;
      var colW = Math.floor(legAvailW / legendCols);

      // 标题
      ctx.fillStyle = '#333';
      ctx.font = 'bold 42px sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText('材料清单：' + paletteLabel + '  (板' + idx + '/' + totalBoards + ')', legX, legY);
      legY += 60;

      // 颜色条目
      ctx.textBaseline = 'top';
      for (var i = 0; i < boardColorList.length; i++) {
        var col = i % legendCols;
        var row = Math.floor(i / legendCols);
        var ex = legX + col * colW;
        var ey = legY + row * LEG_ROW_H;

        var c = boardColorList[i];
        var gCount = hexToGlobalCount[c.hex] || c.count;
        // 色块 (50×40)
        ctx.fillStyle = c.hex;
        ctx.fillRect(ex, ey + 3, 50, 40);
        ctx.strokeStyle = '#999';
        ctx.lineWidth = 0.5;
        ctx.strokeRect(ex, ey + 3, 50, 40);

        // 色号 + 板用量/总用量
        ctx.fillStyle = '#333';
        ctx.font = '30px monospace';
        ctx.textAlign = 'left';
        ctx.fillText(c.code + '  ×' + c.count + '/' + gCount, ex + 58, ey + 3);
      }

      // 材料清单条目结束，总计锚定底部
      var boardTotalY = A4_H - MARGIN;
      ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(legX, boardTotalY - 55); ctx.lineTo(legX + legAvailW, boardTotalY - 55); ctx.stroke();
      ctx.fillStyle = '#333';
      ctx.font = 'bold 38px sans-serif';
      ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      ctx.fillText('板' + idx + ' 合计: ' + boardTotal + ' 颗  |  色数: ' + boardColorList.length,
        legX, boardTotalY);

      // ---- 下载本板 ----
      var link = document.createElement('a');
      link.download = ts + '_' + idx + '.png';
      link.href = offCanvas.toDataURL('image/png');
      link.click();
    }
  }
  } // end if (totalBoards > 1)

  if (totalBoards > 1) {
    showToast('拼豆图纸已导出 (1张总览 + ' + totalBoards + '张分板, ' + ts + ')');
  } else {
    showToast('拼豆图纸已导出 (1张总览, ' + ts + ')');
  }
}

// --- 鐎电厧鍙嗛崶鍓у & 鐟佷礁澹€ ---
let cropImg = null;
let cropZoom = 100;
let cropImgX = 0, cropImgY = 0;
let cropDragStartX = 0, cropDragStartY = 0;
let cropImgStartX = 0, cropImgStartY = 0;
let isCropping = false;

// view mode
let viewMode = 'canvas'; // 'canvas' | 'imported'
let canvasPixelData = null;
let importedPixelData = null;
let importedPreviewImage = null;
let navShowOriginal = false;
function startImport(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    cropImg = new Image();
    cropImg.onload = function() {
      // 閸忓牊妯夌粈鍝勮剨缁愭绱欑涵顔荤箽鐢啫鐪€瑰本鍨氶敍澶涚礉閸愬秷顓哥粻妞剧秴缂?
      document.getElementById('cropOverlay').classList.add('show');
      var vp = document.getElementById('cropViewport');
      // 重置格数选择
      cropGridSize = 24;
      document.querySelectorAll('.grid-size-btn').forEach(function(b) { b.classList.remove('active'); });
      var btn24 = document.getElementById('gridBtn24');
      if (btn24) btn24.classList.add('active');

      // 缁涘绔寸敮褑顔€鐢啫鐪悽鐔告櫏
      requestAnimationFrame(function() {
        var vpW = vp.clientWidth;
        var scale = Math.max(vpW / cropImg.width, vpW / cropImg.height);
        cropZoom = Math.round(scale * 100);
        cropImgX = (vpW - cropImg.width * scale) / 2;
        cropImgY = (vpW - cropImg.height * scale) / 2;
        document.getElementById('cropZoomSlider').value = cropZoom;
        document.getElementById('cropZoomVal').textContent = cropZoom + '%';
        applyCropTransform();
      });
    };
    cropImg.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function applyCropTransform() {
  const img = document.getElementById('cropImage');
  img.src = cropImg.src;
  img.style.display = 'block';
  const scale = cropZoom / 100;
  img.style.width = (cropImg.width * scale) + 'px';
  img.style.height = (cropImg.height * scale) + 'px';
  img.style.left = cropImgX + 'px';
  img.style.top = cropImgY + 'px';
}

function updateCropZoom(val) {
  const oldScale = cropZoom / 100;
  cropZoom = parseInt(val);
  const newScale = cropZoom / 100;
  // 娣囨繃瀵旈崶鍓у娑擃厼绺炬稉宥呭綁
  const vp = document.getElementById('cropViewport');
  const cx = vp.clientWidth / 2;
  const cy = vp.clientHeight / 2;
  cropImgX = cx - (cx - cropImgX) * (newScale / oldScale);
  cropImgY = cy - (cy - cropImgY) * (newScale / oldScale);
  document.getElementById('cropZoomVal').textContent = cropZoom + '%';
  applyCropTransform();
}

// onCropMouseDown
function onCropMouseDown(e) {
  if (e.button !== 0) return;
  if (!cropImg) return;
  isCropping = true;
  cropDragStartX = e.clientX;
  cropDragStartY = e.clientY;
  cropImgStartX = cropImgX;
  cropImgStartY = cropImgY;
  document.getElementById('cropViewport').style.cursor = 'grabbing';
}
function onCropMouseMove(e) {
  if (!isCropping) return;
  cropImgX = cropImgStartX + (e.clientX - cropDragStartX);
  cropImgY = cropImgStartY + (e.clientY - cropDragStartY);
  applyCropTransform();
}
function onCropMouseUp(e) {
  isCropping = false;
  document.getElementById('cropViewport').style.cursor = 'grab';
}
function setCropGridSize(size, btn) {
  cropGridSize = size;
  // 更新按钮激活状态
  document.querySelectorAll('.grid-size-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
}

function onCropWheel(e) {
  if (!cropImg) return;
  e.preventDefault();
  e.stopPropagation();
  var delta = e.deltaY > 0 ? -10 : 10;
  var newZoom = Math.max(10, Math.min(500, cropZoom + delta));
  document.getElementById('cropZoomSlider').value = newZoom;
  updateCropZoom(newZoom);
}

function confirmCrop() {
  if (!cropImg) return;
  // 应用选择的格子数
  GRID_SIZE = cropGridSize;
  var vp = document.getElementById('cropViewport');
  var vpW = vp.clientWidth;
  var scale = cropZoom / 100;
  var colorCount = parseInt(document.getElementById('cropColorCount').value);
  var ditherMode = document.getElementById('cropDither').value; // 'none' | 'fs' | 'atkinson'

  // 使用全局 colorDistRGB 感知色差函数
  function snapTo(c, r, g, b) {
    return colorDistRGB(c[0], c[1], c[2], r, g, b);
  }

  // === Step 1: 超采样 → 每格平均色 ===
  var srcX = -cropImgX / scale;
  var srcY = -cropImgY / scale;
  var srcW = vpW / scale;
  var srcH = vpW / scale;
  var sx = Math.max(0, srcX);
  var sy = Math.max(0, srcY);
  var sw = Math.min(srcW, cropImg.width - sx);
  var sh = Math.min(srcH, cropImg.height - sy);

  var SAMPLE = 8;
  var hiRes = GRID_SIZE * SAMPLE;
  var hiCanvas = document.createElement('canvas');
  hiCanvas.width = hiRes;
  hiCanvas.height = hiRes;
  var hiCtx = hiCanvas.getContext('2d');
  hiCtx.fillStyle = '#FFFFFF';
  hiCtx.fillRect(0, 0, hiRes, hiRes);

  var dx = (sx - srcX) / srcW * hiRes;
  var dy = (sy - srcY) / srcH * hiRes;
  var dw = sw / srcW * hiRes;
  var dh = sh / srcH * hiRes;
  if (sw > 0 && sh > 0) {
    hiCtx.drawImage(cropImg, sx, sy, sw, sh, dx, dy, dw, dh);
  }
  var hiData = hiCtx.getImageData(0, 0, hiRes, hiRes).data;

  var rawR = new Float64Array(GRID_SIZE * GRID_SIZE);
  var rawG = new Float64Array(GRID_SIZE * GRID_SIZE);
  var rawB = new Float64Array(GRID_SIZE * GRID_SIZE);
  for (var gy = 0; gy < GRID_SIZE; gy++) {
    for (var gx = 0; gx < GRID_SIZE; gx++) {
      var sr = 0, sg = 0, sb = 0, cnt = 0;
      for (var dy2 = 0; dy2 < SAMPLE; dy2++) {
        for (var dx2 = 0; dx2 < SAMPLE; dx2++) {
          var px = gx * SAMPLE + dx2;
          var py = gy * SAMPLE + dy2;
          var i = (py * hiRes + px) * 4;
          var a = hiData[i + 3];
          if (a > 128) {
            sr += hiData[i];
            sg += hiData[i + 1];
            sb += hiData[i + 2];
            cnt++;
          }
        }
      }
      var idx = gy * GRID_SIZE + gx;
      if (cnt > 0) {
        rawR[idx] = sr / cnt;
        rawG[idx] = sg / cnt;
        rawB[idx] = sb / cnt;
      } else {
        rawR[idx] = 255; rawG[idx] = 255; rawB[idx] = 255;
      }
    }
  }

  // === Step 2+3: K-means++ 初始化 + 感知加权迭代 ===
  var total = GRID_SIZE * GRID_SIZE;
  var K = Math.min(colorCount, total);

  // 构建非白像素采样池
  var samplePool = [];
  for (var i = 0; i < total; i++) {
    if (rawR[i] < 250 || rawG[i] < 250 || rawB[i] < 250) {
      samplePool.push(i);
    }
  }
  if (samplePool.length === 0) {
    for (var i = 0; i < total; i++) samplePool.push(i);
  }

  // k-means++ 初始化
  var centers = [];
  var firstIdx = samplePool[Math.floor(Math.random() * samplePool.length)];
  centers.push([rawR[firstIdx], rawG[firstIdx], rawB[firstIdx]]);

  var minDist = new Float64Array(total);
  for (var k = 1; k < K; k++) {
    var distSum = 0;
    for (var si = 0; si < samplePool.length; si++) {
      var i = samplePool[si];
      var bestD = Infinity;
      for (var c = 0; c < centers.length; c++) {
        var d = colorDistRGB(rawR[i], rawG[i], rawB[i], centers[c][0], centers[c][1], centers[c][2]);
        if (d < bestD) bestD = d;
      }
      minDist[i] = bestD;
      distSum += bestD;
    }
    var threshold = Math.random() * distSum;
    var accum = 0, picked = samplePool[0];
    for (var si = 0; si < samplePool.length; si++) {
      var i = samplePool[si];
      accum += minDist[i];
      if (accum >= threshold) { picked = i; break; }
    }
    centers.push([rawR[picked], rawG[picked], rawB[picked]]);
  }

  // 强制锚定黑白
  var bestWhite = 0, bestBlack = 0;
  for (var i = 1; i < centers.length; i++) {
    if (snapTo(centers[i], 255, 255, 255) < snapTo(centers[bestWhite], 255, 255, 255)) bestWhite = i;
    if (snapTo(centers[i], 0, 0, 0) < snapTo(centers[bestBlack], 0, 0, 0)) bestBlack = i;
  }
  centers[bestWhite] = [255, 255, 255];
  centers[bestBlack] = [0, 0, 0];

  // K-means 迭代 (12轮, 感知距离)
  for (var iter = 0; iter < 12; iter++) {
    var assigns = new Int32Array(total);
    for (var si = 0; si < samplePool.length; si++) {
      var i = samplePool[si];
      var best = 0, bestD = Infinity;
      for (var k = 0; k < K; k++) {
        var d = colorDistRGB(rawR[i], rawG[i], rawB[i], centers[k][0], centers[k][1], centers[k][2]);
        if (d < bestD) { bestD = d; best = k; }
      }
      assigns[i] = best;
    }
    var sums = [];
    for (var k = 0; k < K; k++) sums.push({r:0, g:0, b:0, n:0});
    for (var si = 0; si < samplePool.length; si++) {
      var i = samplePool[si];
      var k = assigns[i];
      sums[k].r += rawR[i]; sums[k].g += rawG[i]; sums[k].b += rawB[i]; sums[k].n++;
    }
    for (var k = 0; k < K; k++) {
      if (sums[k].n > 0) {
        centers[k] = [Math.round(sums[k].r/sums[k].n), Math.round(sums[k].g/sums[k].n), Math.round(sums[k].b/sums[k].n)];
      }
    }
  }
  var palette = centers;

  // 最近色查找 (感知加权)
  function nearestColor(r, g, b) {
    var best = 0, bestD = Infinity;
    for (var i = 0; i < palette.length; i++) {
      var d = colorDistRGB(r, g, b, palette[i][0], palette[i][1], palette[i][2]);
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  }

  // === Step 4: 抖动 + 颜色映射 ===
  var outR = new Float64Array(total);
  var outG = new Float64Array(total);
  var outB = new Float64Array(total);

  if (ditherMode === 'fs') {
    // Floyd-Steinberg 误差扩散
    var errR = new Float64Array(total);
    var errG = new Float64Array(total);
    var errB = new Float64Array(total);
    for (var y = 0; y < GRID_SIZE; y++) {
      for (var x = 0; x < GRID_SIZE; x++) {
        var idx = y * GRID_SIZE + x;
        var r = Math.min(255, Math.max(0, rawR[idx] + errR[idx]));
        var g = Math.min(255, Math.max(0, rawG[idx] + errG[idx]));
        var b = Math.min(255, Math.max(0, rawB[idx] + errB[idx]));
        var pi = nearestColor(r, g, b);
        outR[idx] = palette[pi][0];
        outG[idx] = palette[pi][1];
        outB[idx] = palette[pi][2];
        var er = r - outR[idx];
        var eg = g - outG[idx];
        var eb = b - outB[idx];
        if (x + 1 < GRID_SIZE) {
          var ri = y * GRID_SIZE + (x + 1);
          errR[ri] += er * 7/16; errG[ri] += eg * 7/16; errB[ri] += eb * 7/16;
        }
        if (y + 1 < GRID_SIZE) {
          if (x - 1 >= 0) {
            var bl = (y + 1) * GRID_SIZE + (x - 1);
            errR[bl] += er * 3/16; errG[bl] += eg * 3/16; errB[bl] += eb * 3/16;
          }
          var bd = (y + 1) * GRID_SIZE + x;
          errR[bd] += er * 5/16; errG[bd] += eg * 5/16; errB[bd] += eb * 5/16;
          if (x + 1 < GRID_SIZE) {
            var br = (y + 1) * GRID_SIZE + (x + 1);
            errR[br] += er * 1/16; errG[br] += eg * 1/16; errB[br] += eb * 1/16;
          }
        }
      }
    }
  } else if (ditherMode === 'atkinson') {
    // Atkinson 误差扩散 (1/8权重, 对比度更高, 像素画常用)
    var errR = new Float64Array(total);
    var errG = new Float64Array(total);
    var errB = new Float64Array(total);
    for (var y = 0; y < GRID_SIZE; y++) {
      for (var x = 0; x < GRID_SIZE; x++) {
        var idx = y * GRID_SIZE + x;
        var r = Math.min(255, Math.max(0, rawR[idx] + errR[idx]));
        var g = Math.min(255, Math.max(0, rawG[idx] + errG[idx]));
        var b = Math.min(255, Math.max(0, rawB[idx] + errB[idx]));
        var pi = nearestColor(r, g, b);
        outR[idx] = palette[pi][0];
        outG[idx] = palette[pi][1];
        outB[idx] = palette[pi][2];
        var er = (r - outR[idx]) / 8;
        var eg = (g - outG[idx]) / 8;
        var eb = (b - outB[idx]) / 8;
        // Atkinson pattern: forward 2, down 3
        if (x + 1 < GRID_SIZE) {
          var r1 = y * GRID_SIZE + (x + 1);
          errR[r1] += er; errG[r1] += eg; errB[r1] += eb;
        }
        if (x + 2 < GRID_SIZE) {
          var r2 = y * GRID_SIZE + (x + 2);
          errR[r2] += er; errG[r2] += eg; errB[r2] += eb;
        }
        if (y + 1 < GRID_SIZE) {
          if (x - 1 >= 0) {
            var d0 = (y + 1) * GRID_SIZE + (x - 1);
            errR[d0] += er; errG[d0] += eg; errB[d0] += eb;
          }
          var d1 = (y + 1) * GRID_SIZE + x;
          errR[d1] += er; errG[d1] += eg; errB[d1] += eb;
          if (x + 1 < GRID_SIZE) {
            var d2 = (y + 1) * GRID_SIZE + (x + 1);
            errR[d2] += er; errG[d2] += eg; errB[d2] += eb;
          }
        }
        if (y + 2 < GRID_SIZE) {
          var d3 = (y + 2) * GRID_SIZE + x;
          errR[d3] += er; errG[d3] += eg; errB[d3] += eb;
        }
      }
    }
  } else {
    // 无抖动：直接最近色映射
    for (var i = 0; i < total; i++) {
      var pi = nearestColor(rawR[i], rawG[i], rawB[i]);
      outR[i] = palette[pi][0];
      outG[i] = palette[pi][1];
      outB[i] = palette[pi][2];
    }
  }

  // === Step 5: 写入像素数据 ===
  importedPixelData = [];
  var coloredCount = 0;
  for (var y = 0; y < GRID_SIZE; y++) {
    importedPixelData[y] = [];
    for (var x = 0; x < GRID_SIZE; x++) {
      var idx = y * GRID_SIZE + x;
      var rr = Math.round(outR[idx]);
      var gg = Math.round(outG[idx]);
      var bb = Math.round(outB[idx]);
      if (rr === 255 && gg === 255 && bb === 255) {
        importedPixelData[y][x] = '#FFFFFF';
      } else {
        importedPixelData[y][x] = '#' + [rr,gg,bb].map(function(c){
          return ('0'+c.toString(16)).slice(-2).toUpperCase();
        }).join('');
        coloredCount++;
      }
    }
  }

  // === Step 6: 预览图 ===
  var PREVIEW_SIZE = 256;
  var rawPreview = document.createElement('canvas');
  rawPreview.width = PREVIEW_SIZE;
  rawPreview.height = PREVIEW_SIZE;
  var rawPrevCtx = rawPreview.getContext('2d');
  rawPrevCtx.fillStyle = '#FFFFFF';
  rawPrevCtx.fillRect(0, 0, PREVIEW_SIZE, PREVIEW_SIZE);
  var rdx = (sx - srcX) / srcW * PREVIEW_SIZE;
  var rdy = (sy - srcY) / srcH * PREVIEW_SIZE;
  var rdw = sw / srcW * PREVIEW_SIZE;
  var rdh = sh / srcH * PREVIEW_SIZE;
  if (sw > 0 && sh > 0) {
    rawPrevCtx.drawImage(cropImg, sx, sy, sw, sh, rdx, rdy, rdw, rdh);
  }
  importedPreviewImage = new Image();
  importedPreviewImage.src = rawPreview.toDataURL();

  canvasPixelData = pixelData.map(function(row) { return row.slice(); });
  pixelData = importedPixelData.map(function(row) { return row.slice(); });
  viewMode = 'imported';
  navShowOriginal = false;
  undoStack = [pixelData.map(function(row) { return row.slice(); })];
  redoStack = [];

  document.getElementById('cropOverlay').classList.remove('show');
  document.getElementById('navToggleBtn').disabled = false;
  document.getElementById('overlayControls').style.display = '';
  document.getElementById('navToggleBtn').classList.add('imported-mode');
  document.getElementById('navToggleLabel').textContent = '原图';

  // 自动适配缩放: 使画布适合480px容器
  var fitZoom = Math.floor(480 / (GRID_SIZE * BASE_CELL_SIZE) * 100);
  if (fitZoom < 20) fitZoom = 20;
  if (fitZoom > 100) fitZoom = 100;
  zoom = fitZoom;
  var zoomSlider = document.getElementById('zoomSlider');
  zoomSlider.value = zoom;
  zoomSlider.min = Math.min(20, zoom);
  document.getElementById('zoomValue').textContent = zoom + '%';
  if (zoom === 85) {
    canvasContainer.scrollLeft = 0;
    canvasContainer.scrollTop = 0;
  }

  updateCanvasSize();
  renderCanvas();
  renderNavigator();
  renderColorGrid();
  saveToStorage(true);
  showToast('Imported: ' + coloredCount + ' / ' + (GRID_SIZE*GRID_SIZE) + ' px | ' + palette.length + ' colors  |  缩放 ' + zoom + '%');
}

function cancelCrop() {
  document.getElementById('cropOverlay').classList.remove('show');
  cropImg = null;
}

function reImportCurrent() {
  if (!cropImg) {
    // 无缓存图片，打开文件选择
    document.getElementById('importFileInput').click();
    return;
  }
  // 重新打开裁切对话框，保留之前的缩放/位置
  document.getElementById('cropOverlay').classList.add('show');
  applyCropTransform();
  showToast('已重新打开裁切');
}

// --- 参考图叠加 ---
function renderOverlay() {
  if (!overlayVisible || !importedPreviewImage || !importedPreviewImage.complete) {
    overlayCanvas.style.display = 'none';
    return;
  }
  var cellSize = BASE_CELL_SIZE * (zoom / 100);
  var w = GRID_SIZE * cellSize;
  overlayCanvas.width = w;
  overlayCanvas.height = w;
  overlayCanvas.style.display = 'block';
  overlayCtx.clearRect(0, 0, w, w);
  overlayCtx.globalAlpha = overlayOpacity;
  overlayCtx.imageSmoothingEnabled = true;
  overlayCtx.drawImage(importedPreviewImage, 0, 0, w, w);
  overlayCtx.globalAlpha = 1;
}

function toggleOverlay() {
  overlayVisible = !overlayVisible;
  var btn = document.getElementById('overlayToggleBtn');
  if (overlayVisible) {
    btn.textContent = '参考图 ON';
    btn.style.background = '#4A90D9';
    btn.style.color = '#fff';
  } else {
    btn.textContent = '参考图 OFF';
    btn.style.background = '#444';
    btn.style.color = '#aaa';
  }
  renderOverlay();
}

function updateOverlayOpacity(val) {
  overlayOpacity = parseInt(val) / 100;
  document.getElementById('overlayOpacityVal').textContent = val + '%';
  if (overlayVisible) renderOverlay();
}

function toggleViewMode() {
  // 閸欘亜鍨忛幑銏犱箯娓氀冾嚤閼割亜娅掗惃鍕暕鐟欏牆鍞寸€圭櫢绱欓崢鐔锋禈 閳?閸嶅繒绀岄崶鎾呯礆閿涘奔瀵岄悽璇茬娑撳秴褰?
  navShowOriginal = !navShowOriginal;
  var btn = document.getElementById('navToggleBtn');
  var label = document.getElementById('navToggleLabel');
  if (navShowOriginal) {
    btn.classList.add('imported-mode');
    label.textContent = '原图';
  } else {
    btn.classList.remove('imported-mode');
    label.textContent = '像素化';
  }
  renderNavigator();
}

// --- 缂傗晜鏂?---
// 根据画布格子数动态计算最小缩放(画布撑满400px即可)
function getMinZoom() {
  return Math.max(20, Math.min(85, Math.floor(400 / (GRID_SIZE * BASE_CELL_SIZE) * 100)));
}

function setZoom(value) {
  zoom = parseInt(value);
  document.getElementById('zoomValue').textContent = zoom + '%';
  // 同步移动端缩放显示
  var mbVal = document.getElementById('zoomValueMb');
  if (mbVal) mbVal.textContent = zoom + '%';
  var slider = document.getElementById('zoomSlider');
  if (slider) slider.value = zoom;
  updateCanvasSize();
  renderCanvas();
  // 缩放到最小值时自动居中
  if (zoom === getMinZoom()) {
    canvasContainer.scrollLeft = 0;
    canvasContainer.scrollTop = 0;
  }
}

// 移动端缩放按钮 +/-
function adjustZoom(delta) {
  var newZoom = zoom + delta;
  newZoom = Math.max(20, Math.min(300, newZoom));
  setZoom(newZoom);
}

// --- 妫版粏澹婇弰鍓с仛閺囧瓨鏌?---
function updateColorDisplay(hex, label, extra) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  document.getElementById('colorSwatch').style.background = hex;
  document.getElementById('colorLabel').textContent = label || 'Brush';
  var info = 'RGB(' + r + ', ' + g + ', ' + b + ')<br>' + hex;
  // 官方模式下查找色号
  if (paletteMode === 'official') {
    var entry = findPaletteEntry(hex);
    if (entry && paletteCode(entry)) {
      info += '<br>色号: ' + paletteCode(entry);
    }
  }
  if (extra) info += '<br>' + extra;
  document.getElementById('colorInfo').innerHTML = info;
}

// --- 瀹搞儱鍙块崚鍥ㄥ床 ---
function setTool(tool) {
  currentTool = tool;
  document.getElementById('brushTool').classList.toggle('active', tool === 'brush');
  document.getElementById('eraserTool').classList.toggle('active', tool === 'eraser');
  document.getElementById('inspectTool').classList.toggle('active', tool === 'inspect');

  if (tool === 'eraser') {
    updateColorDisplay('#FFFFFF', 'Eraser');
  } else if (tool === 'inspect') {
    document.getElementById('colorLabel').textContent = 'Inspector';
    document.getElementById('colorInfo').textContent = 'Click a pixel to inspect';
  } else {
    updateColorDisplay(currentColor, 'Brush');
  }
}

// --- 鐎光剝鐓￠崓蹇曠 ---
function inspectPixel(gx, gy) {
  if (gx < 0 || gx >= GRID_SIZE || gy < 0 || gy >= GRID_SIZE) return;
  const hex = pixelData[gy][gx];
  currentColor = hex;
  updateColorDisplay(hex, 'Brush');
  setTool('brush');
}

// --- 点击色卡取色 ---
function onSwatchClick(e) {
  e.stopPropagation();
  // 从色块DOM直接读取实际显示的颜色(避免currentColor未同步)
  var hex = document.getElementById('colorSwatch').style.background;
  // 处理浏览器可能转换的rgb()格式
  if (hex.slice(0,3) === 'rgb') {
    var m = hex.match(/[\d.]+/g);
    if (m && m.length >= 3) {
      hex = '#' + ((1 << 24) + (parseInt(m[0]) << 16) + (parseInt(m[1]) << 8) + parseInt(m[2])).toString(16).slice(1).toUpperCase();
    }
  }
  if (!hex || hex === '#FFFFFF' && currentTool === 'eraser') return;
  var rect = document.getElementById('colorSwatch').getBoundingClientRect();
  showColorPickPopup(hex, rect);
}

// --- 吸管点击导航器取色 ---
function onNavClick(e) {
  // 仅在吸管模式下响应
  if (currentTool !== 'inspect') return;

  var rect = navCanvas.getBoundingClientRect();
  var sx = e.clientX - rect.left;
  var sy = e.clientY - rect.top;
  if (sx < 0 || sy < 0 || sx >= rect.width || sy >= rect.height) return;

  // 从navCanvas读取像素颜色 (navCanvas尺寸 128×128)
  var navW = navCanvas.width;
  var navH = navCanvas.height;
  var px = Math.floor(sx / rect.width * navW);
  var py = Math.floor(sy / rect.height * navH);
  if (px < 0 || px >= navW || py < 0 || py >= navH) return;

  var pixel = navCtx.getImageData(px, py, 1, 1).data;
  var r = pixel[0], g = pixel[1], b = pixel[2];
  // 跳过纯白(空像素)
  if (r === 255 && g === 255 && b === 255) return;

  var hex = '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();

  // 显示取色弹窗
  showColorPickPopup(hex, rect);
}

function showColorPickPopup(hex, navRect) {
  var r = parseInt(hex.slice(1,3), 16);
  var g = parseInt(hex.slice(3,5), 16);
  var b = parseInt(hex.slice(5,7), 16);

  // 查找精确匹配的色号
  var entry = findPaletteEntry(hex);
  var code = entry ? paletteCode(entry) : '';

  // 更新顶部: 色块 + RGB + 色号
  document.getElementById('pickSwatch').style.background = hex;
  var infoHtml = 'RGB(' + r + ', ' + g + ', ' + b + ') ' + hex;
  if (code) {
    infoHtml += ' <span class=\"pick-code\">' + code + '</span>';
  }
  document.getElementById('pickInfo').innerHTML = infoHtml;

  // 查找5个最接近的色板颜色
  var top5 = findTop5Closest(r, g, b);
  var optionsEl = document.getElementById('pickOptions');
  optionsEl.innerHTML = '';
  top5.forEach(function(item) {
    var opt = document.createElement('div');
    opt.className = 'pick-option';
    opt.style.background = item.hex;
    opt.title = item.code + ' ' + item.hex;
    // 色号标签
    var codeLabel = document.createElement('span');
    codeLabel.className = 'pick-option-code';
    codeLabel.textContent = item.code.replace(/^80-/, '');
    opt.appendChild(codeLabel);
    // 点击选择该颜色
    opt.addEventListener('click', function(ev) {
      ev.stopPropagation();
      selectPickOption(item.hex);
    });
    optionsEl.appendChild(opt);
  });

  // 定位弹窗: 在导航器右侧
  var popup = document.getElementById('colorPickPopup');
  var top = navRect.top;
  var left = navRect.right + 8;
  // 避免超出屏幕右侧
  if (left + 308 > window.innerWidth) {
    left = navRect.left - 308;
  }
  // 避免超出屏幕底部
  if (top + 100 > window.innerHeight) {
    top = window.innerHeight - 110;
  }
  if (top < 0) top = 8;
  popup.style.top = top + 'px';
  popup.style.left = left + 'px';
  popup.classList.add('show');
}

function hideColorPickPopup() {
  document.getElementById('colorPickPopup').classList.remove('show');
}

function selectPickOption(hex) {
  currentColor = hex;
  // 更新吸管颜色显示
  updateColorDisplay(hex, 'Brush');
  // 自动切换到画笔模式
  setTool('brush');
  hideColorPickPopup();
}

// 查找与目标RGB最接近的5个色板颜色
function findTop5Closest(r, g, b) {
  var palette = OFFICIAL_COLORS;
  // 如果当前是画布用色模式, 也用官方色板(至少MARD_DATA)
  if (palette.length === 0) palette = MARD_DATA;

  var results = [];
  for (var i = 0; i < palette.length; i++) {
    var entry = palette[i];
    var hex = paletteHex(entry);
    var pr = parseInt(hex.slice(1,3), 16);
    var pg = parseInt(hex.slice(3,5), 16);
    var pb = parseInt(hex.slice(5,7), 16);
    var d = colorDistRGB(r, g, b, pr, pg, pb);
    results.push({ code: paletteCode(entry), hex: hex, dist: d });
  }
  results.sort(function(a, b) { return a.dist - b.dist; });
  return results.slice(0, 5);
}

// 点击弹窗外部关闭
document.addEventListener('click', function(e) {
  var popup = document.getElementById('colorPickPopup');
  if (popup && popup.classList.contains('show') && !popup.contains(e.target) && e.target !== navCanvas && e.target !== document.getElementById('colorSwatch')) {
    hideColorPickPopup();
  }
  var exportDD = document.getElementById('exportDropdown');
  if (exportDD && exportDD.classList.contains('show') && !exportDD.contains(e.target)) {
    hideExportDropdown();
  }
});

// --- 色板渲染 ---
const PALETTE_SLOTS = 24; // 色板最大槽位

// 获取当前模式下的纯hex颜色数组
function getCurrentPaletteColors() {
  if (paletteMode === 'official' && OFFICIAL_COLORS.length > 0) {
    return OFFICIAL_COLORS.map(paletteHex);
  }
  return getUsedColors();
}

// 感知色差 (人眼对G最敏感, 权重: R×2 G×4 B×3)
function colorDistRGB(r1, g1, b1, r2, g2, b2) {
  var dr = r1 - r2, dg = g1 - g2, db = b1 - b2;
  return 2*dr*dr + 4*dg*dg + 3*db*db;
}

// ============================================================
// 色板选择系统 (下拉面板)
// ============================================================
function togglePalettePicker() {
  var picker = document.getElementById('palettePicker');
  var menu = document.getElementById('palettePickerMenu');
  if (menu.style.display !== 'none') {
    menu.style.display = 'none';
    picker.classList.remove('open');
  } else {
    renderPaletteMenu();
    menu.style.display = 'block';
    picker.classList.add('open');
  }
}

function renderPaletteMenu() {
  var menu = document.getElementById('palettePickerMenu');
  menu.innerHTML = '';
  PALETTE_DEFS.forEach(function(def) {
    var item = document.createElement('button');
    item.className = 'palette-picker-item';
    if (def.id === currentPaletteId) item.classList.add('active');
    if (def.colors.length === 0 && def.id !== 'exhibition') {
      item.classList.add('empty');
      item.textContent = def.label;
      item.disabled = true;
    } else {
      item.innerHTML = '<span class="item-dot" style="background:' + def.color + '"></span>' + def.label;
    }
    item.addEventListener('click', function() {
      selectPalette(def.id);
    });
    menu.appendChild(item);
  });
}

function selectPalette(id) {
  var def = PALETTE_DEFS.find(function(d) { return d.id === id; });
  if (!def) return;

  currentPaletteId = id;
  OFFICIAL_COLORS = def.colors;
  buildHexCodeMap();

  // 更新按钮外观
  var btn = document.getElementById('palettePickerBtn');
  var label = document.getElementById('palettePickerLabel');
  label.textContent = '色板: ' + def.label;
  btn.style.background = def.colors.length > 0 ? '#C57820' : '#3A6BC5';

  paletteMode = (def.colors.length > 0) ? 'official' : 'canvas';
  currentPaletteIdx = 0;

  // 有颜色数据时自动匹配替换
  var snapped = 0;
  if (def.colors.length > 0) {
    currentColor = paletteHex(def.colors[0]);
    currentTool = 'brush';

    var officialRGB = def.colors.map(function(e) {
      var h = e.hex;
      return { r: parseInt(h.slice(1,3),16), g: parseInt(h.slice(3,5),16), b: parseInt(h.slice(5,7),16), hex: h };
    });

    pushUndo();
    for (var y = 0; y < GRID_SIZE; y++) {
      for (var x = 0; x < GRID_SIZE; x++) {
        var c = pixelData[y][x];
        if (c === '#FFFFFF') continue;
        var r = parseInt(c.slice(1,3),16);
        var g = parseInt(c.slice(3,5),16);
        var b = parseInt(c.slice(5,7),16);
        var best = officialRGB[0], bestD = Infinity;
        for (var i = 0; i < officialRGB.length; i++) {
          var d = colorDistRGB(r, g, b, officialRGB[i].r, officialRGB[i].g, officialRGB[i].b);
          if (d < bestD) { bestD = d; best = officialRGB[i]; }
        }
        if (best.hex !== c) {
          pixelData[y][x] = best.hex;
          snapped++;
        }
      }
    }
  }

  // 关闭菜单
  document.getElementById('palettePickerMenu').style.display = 'none';
  document.getElementById('palettePicker').classList.remove('open');

  renderColorGrid();
  renderCanvas();
  renderNavigator();

  if (snapped > 0) {
    showToast('已匹配 ' + snapped + ' 个像素到' + def.label + '色板 (Ctrl+Z可撤销)');
  }
}

// 点击外部关闭下拉
document.addEventListener('click', function(e) {
  var picker = document.getElementById('palettePicker');
  if (picker && !picker.contains(e.target)) {
    document.getElementById('palettePickerMenu').style.display = 'none';
    picker.classList.remove('open');
  }
});

function renderColorGrid() {
  const grid = document.getElementById('colorGrid');
  const palette = getCurrentPaletteColors();
  grid.innerHTML = '';

  // 官方模式支持翻页 (291色 > 24槽位)
  var totalPages = Math.ceil(palette.length / PALETTE_SLOTS);
  if (currentPaletteIdx >= totalPages) currentPaletteIdx = 0;
  var startIdx = currentPaletteIdx * PALETTE_SLOTS;

  for (let i = 0; i < PALETTE_SLOTS; i++) {
    const swatch = document.createElement('div');
    swatch.className = 'color-swatch';
    var dataIdx = startIdx + i;
    if (dataIdx < palette.length) {
      const color = palette[dataIdx];
      swatch.style.background = color;

      // 官方模式显示色号标签
      var code = '';
      if (paletteMode === 'official') {
        code = paletteCode(OFFICIAL_COLORS[dataIdx]);
      }
      if (code) {
        swatch.title = code + ' ' + color;
        // MARD色号无80-前缀，直接显示 (如 A1, B15)
        var shortCode = code.replace(/^80-/, '');
        var label = document.createElement('span');
        label.className = 'swatch-code';
        label.textContent = shortCode;
        swatch.appendChild(label);
      } else {
        swatch.title = color;
      }

      if (color === currentColor && currentTool === 'brush') {
        swatch.classList.add('active');
      }
      swatch.addEventListener('click', () => selectColor(color, swatch));
    } else {
      swatch.style.background = '#2C2C30';
      swatch.style.borderColor = 'rgba(255,255,255,0.12)';
      swatch.title = 'Empty slot';
      swatch.style.cursor = 'default';
    }
    grid.appendChild(swatch);
  }

  // 更新翻页按钮文字
  if (paletteMode === 'official' && totalPages > 1) {
    var btn = document.querySelector('.more-colors-btn');
    btn.textContent = '↻ ' + (currentPaletteIdx + 1) + '/' + totalPages;
    btn.title = '翻页 (' + totalPages + '页共' + palette.length + '色)';
  }
}

function selectColor(color, swatchEl) {
  currentColor = color;
  currentTool = 'brush';
  document.getElementById('brushTool').classList.add('active');
  document.getElementById('eraserTool').classList.remove('active');
  document.getElementById('inspectTool').classList.remove('active');

  // 官方模式下显示色号
  var entry = (paletteMode === 'official') ? findPaletteEntry(color) : null;
  var code = entry ? paletteCode(entry) : '';
  var display = 'Brush' + (code ? ' · ' + code : '');
  updateColorDisplay(color, display);

  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
  if (swatchEl) {
    swatchEl.classList.add('active');
  } else {
    const swatches = document.querySelectorAll('.color-swatch');
    const palette = getCurrentPaletteColors();
    const idx = palette.indexOf(color);
    if (idx >= 0 && swatches[idx]) swatches[idx].classList.add('active');
  }
}

function cyclePalette() {
  if (paletteMode === 'official') {
    var palette = getCurrentPaletteColors();
    var totalPages = Math.ceil(palette.length / PALETTE_SLOTS);
    currentPaletteIdx = (currentPaletteIdx + 1) % totalPages;
  }
  renderColorGrid();
  if (paletteMode === 'official') {
    var palette = getCurrentPaletteColors();
    var totalPages = Math.ceil(palette.length / PALETTE_SLOTS);
    showToast('色板 ' + (currentPaletteIdx + 1) + '/' + totalPages + ' (' + palette.length + '色)');
  } else {
    showToast('色板已刷新');
  }
}

// --- 闁款喚娲忚箛顐ｅ祹闁?---
function onKeyDown(e) {
  // 缁岀儤鐗搁幐澶夌瑓閿涘牅绗夐崷銊ㄧ翻閸忋儲顢嬮崘鍜冪礆閳?閸氼垳鏁ら幏鏍ㄥ楠炲磭些
  if (e.code === 'Space' && !e.target.closest('input,textarea,button')) {
    e.preventDefault();
    if (!spaceHeld) {
      spaceHeld = true;
      mainCanvas.style.cursor = 'grab';
      canvasContainer.style.cursor = 'grab';
    }
    return;
  }
  if (e.ctrlKey && e.key === 'z') {
    e.preventDefault();
    if (e.shiftKey) redo();
    else undo();
  } else if (e.ctrlKey && e.key === 'y') {
    e.preventDefault();
    redo();
  } else if (e.key === 'b' || e.key === 'B') {
    setTool('brush');
  } else if (e.key === 'e' || e.key === 'E') {
    setTool('eraser');
  } else if (e.ctrlKey && e.key === 's') {
    e.preventDefault();
    toggleExportDropdown();
  }
}

function onKeyUp(e) {
  if (e.code === 'Space') {
    spaceHeld = false;
    if (!isPanning) {
      mainCanvas.style.cursor = 'crosshair';
      canvasContainer.style.cursor = '';
    }
  }
}

// --- Toast ---
let toastTimer;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
}

// --- 启动 ---
document.addEventListener('DOMContentLoaded', init);

// --- 移动端横竖屏检测（比CSS orientation更可靠）---
function checkOrientation() {
  var hint = document.getElementById('rotateHint');
  if (!hint) return;
  var isPortrait = window.innerWidth < window.innerHeight;
  var isNarrow = window.innerWidth < 768;
  if (isNarrow && isPortrait) {
    hint.classList.add('show');
  } else {
    hint.classList.remove('show');
  }
}
window.addEventListener('load', checkOrientation);
window.addEventListener('resize', checkOrientation);
window.addEventListener('orientationchange', function() {
  // orientationchange回调时尺寸可能还没更新，延迟检查
  setTimeout(checkOrientation, 200);
});
