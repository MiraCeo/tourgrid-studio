name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --require-hashes --requirement requirements.lock
      - name: Install Chromium for browser regression tests
        run: python -m playwright install --with-deps chromium
      - name: Run test suite
        run: python -m pytest

  postgres-store:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: tourgrid_test
          POSTGRES_USER: tourgrid_test
          POSTGRES_PASSWORD: tourgrid-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tourgrid_test -d tourgrid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --require-hashes --requirement requirements.lock
      - name: Test PostgreSQL store directly
        env:
          TOURGRID_TEST_DATABASE_URL: postgresql://tourgrid_test:tourgrid-test-password@127.0.0.1:5432/tourgrid_test
        run: >-
          python -m pytest
          tests/test_postgres_work_store.py
          -m postgres_store

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned audit tooling
        run: >-
          python -m pip install
          --require-hashes
          --requirement requirements-security.lock
      - name: Audit production Python dependencies
        continue-on-error: true
        run: >-
          python -m pip_audit
          --require-hashes
          --requirement requirements-prod.lock

  container-smoke:
    runs-on: ubuntu-latest
    needs:
      - test
      - postgres-store
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build containers
        run: docker compose build
      - name: Scan API image for known vulnerabilities
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tourgrid-studio-api:local
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Scan web image for known vulnerabilities
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tourgrid-studio-web:local
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Start application
        run: docker compose up --detach --wait --wait-timeout 180
      - name: Smoke test same-origin delivery
        run: |
          curl --fail --show-error http://127.0.0.1:8080/api/v1/health | grep -q '"status":"ok"'
          curl --fail --show-error http://127.0.0.1:8080/api/v1/ready | grep -q '"status":"ready"'
          curl --fail --show-error http://127.0.0.1:8080/ | grep -q 'pixelCanvas'
          python -c "import base64,json; print(json.dumps({'schemaVersion':1,'paletteId':'official-40-v1','paletteVersion':1,'pixels':base64.b64encode(bytes(432)).decode()}))" > /tmp/work.json
          curl --fail --show-error \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/work.json \
            http://127.0.0.1:8080/api/v1/works | grep -q '"code"'
      - name: Show logs after a failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop application
        if: always()
        run: docker compose down --volumes
