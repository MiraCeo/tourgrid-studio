name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Install Chromium for browser regression tests
        run: python -m playwright install --with-deps chromium
      - name: Run test suite
        run: python -m pytest

  container-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build containers
        run: docker compose build
      - name: Start application
        run: docker compose up --detach --wait --wait-timeout 180
      - name: Smoke test same-origin delivery
        run: |
          curl --fail --show-error http://127.0.0.1:8080/api/v1/health | grep -q '"status":"ok"'
          curl --fail --show-error http://127.0.0.1:8080/ | grep -q 'pixelCanvas'
          python -c "import base64,json; print(json.dumps({'schemaVersion':1,'paletteId':'natural-64-v1','paletteVersion':1,'pixels':base64.b64encode(bytes(432)).decode()}))" > /tmp/work.json
          curl --fail --show-error \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/work.json \
            http://127.0.0.1:8080/api/v1/works | grep -q '"code"'
      - name: Show logs after a failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop application
        if: always()
        run: docker compose down --volumes
