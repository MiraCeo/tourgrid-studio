name: tourgrid-studio

services:
  api:
    image: tourgrid-studio-api:${TOURGRID_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      TOURGRID_ENVIRONMENT: ${TOURGRID_ENVIRONMENT:-development}
      TOURGRID_RELEASE: ${TOURGRID_RELEASE:-local}
      TOURGRID_MAX_UPLOAD_BYTES: ${TOURGRID_MAX_UPLOAD_BYTES:-10485760}
      TOURGRID_MAX_IMAGE_WIDTH: ${TOURGRID_MAX_IMAGE_WIDTH:-8192}
      TOURGRID_MAX_IMAGE_HEIGHT: ${TOURGRID_MAX_IMAGE_HEIGHT:-8192}
      TOURGRID_MAX_IMAGE_PIXELS: ${TOURGRID_MAX_IMAGE_PIXELS:-25000000}
      TOURGRID_PROCESSING_TIMEOUT_SECONDS: ${TOURGRID_PROCESSING_TIMEOUT_SECONDS:-30}
      TOURGRID_QUEUE_TIMEOUT_SECONDS: ${TOURGRID_QUEUE_TIMEOUT_SECONDS:-2}
      TOURGRID_MAX_CONCURRENT_CONVERSIONS: ${TOURGRID_MAX_CONCURRENT_CONVERSIONS:-2}
      TOURGRID_PREVIEW_TTL_SECONDS: ${TOURGRID_PREVIEW_TTL_SECONDS:-300}
      TOURGRID_PREVIEW_CACHE_ENTRIES: ${TOURGRID_PREVIEW_CACHE_ENTRIES:-128}
      TOURGRID_RATE_LIMIT_REQUESTS: ${TOURGRID_RATE_LIMIT_REQUESTS:-10}
      TOURGRID_RATE_LIMIT_WINDOW_SECONDS: ${TOURGRID_RATE_LIMIT_WINDOW_SECONDS:-60}
      TOURGRID_SENTRY_DSN: ${TOURGRID_SENTRY_DSN:-}
      TOURGRID_SENTRY_TRACES_SAMPLE_RATE: ${TOURGRID_SENTRY_TRACES_SAMPLE_RATE:-0}
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  web:
    image: tourgrid-studio-web:${TOURGRID_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    environment:
      TOURGRID_SITE_ADDRESS: ${TOURGRID_SITE_ADDRESS:-http://}
      TOURGRID_PROXY_MAX_BODY_SIZE: ${TOURGRID_PROXY_MAX_BODY_SIZE:-11MB}
    ports:
      - "${TOURGRID_HTTP_PORT:-8080}:80"
      - "${TOURGRID_HTTPS_PORT:-8443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
