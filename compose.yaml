name: tourgrid-studio

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tourgrid
      POSTGRES_USER: tourgrid
      POSTGRES_PASSWORD: ${TOURGRID_DB_PASSWORD:-tourgrid-development}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${TOURGRID_DB_PORT:-5432}:5432"
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tourgrid -d tourgrid"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: tourgrid-studio-api:${TOURGRID_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TOURGRID_ENVIRONMENT: ${TOURGRID_ENVIRONMENT:-development}
      TOURGRID_RELEASE: ${TOURGRID_RELEASE:-local}
      TOURGRID_DATABASE_URL: postgresql://tourgrid:${TOURGRID_DB_PASSWORD:-tourgrid-development}@db:5432/tourgrid
      TOURGRID_REDIS_URL: redis://redis:6379/0
      TOURGRID_ADMIN_TOKEN: ${TOURGRID_ADMIN_TOKEN:-}
      TOURGRID_VIEW_DEDUPE_SECONDS: ${TOURGRID_VIEW_DEDUPE_SECONDS:-1800}
      TOURGRID_RATE_LIMIT_REQUESTS: ${TOURGRID_RATE_LIMIT_REQUESTS:-10}
      TOURGRID_RATE_LIMIT_WINDOW_SECONDS: ${TOURGRID_RATE_LIMIT_WINDOW_SECONDS:-60}
      TOURGRID_RATE_LIMIT_MAX_CLIENTS: ${TOURGRID_RATE_LIMIT_MAX_CLIENTS:-10000}
      TOURGRID_SENTRY_DSN: ${TOURGRID_SENTRY_DSN:-}
      TOURGRID_SENTRY_TRACES_SAMPLE_RATE: ${TOURGRID_SENTRY_TRACES_SAMPLE_RATE:-0}
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  web:
    image: tourgrid-studio-web:${TOURGRID_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    environment:
      TOURGRID_SITE_ADDRESS: ${TOURGRID_SITE_ADDRESS:-http://}
      TOURGRID_PROXY_MAX_BODY_SIZE: ${TOURGRID_PROXY_MAX_BODY_SIZE:-128KB}
    ports:
      - "${TOURGRID_BIND_ADDRESS:-127.0.0.1}:${TOURGRID_HTTP_PORT:-8080}:80"
      - "${TOURGRID_BIND_ADDRESS:-127.0.0.1}:${TOURGRID_HTTPS_PORT:-8443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:2015/
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
