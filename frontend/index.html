<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>明日方舟夏日嘉年华像素画编辑器</title>
<link rel="stylesheet" href="/static/css/editor.css">
</head>
<body>

<!-- ============================================================
     Z-INDEX 1: 閼冲本娅欑仦?+ 濠曞倹璇炵憗鍛淬偘
     ============================================================ -->
<div class="bg-layer"></div>

<!-- 瀹革缚绗傞崶鍓у -->
<div class="top-image-area">
  <img src="sucai/wenzi.png" alt="Summer Carnival '26" onerror="this.style.display='none'">
</div>

<!-- ============================================================
     Z-INDEX 2: 底部横幅
     ============================================================ -->
<div class="bottom-banner">
  <span class="banner-text">创作出属于自己的作品吧</span>
</div>

<!-- ============================================================
     Z-INDEX 3: 缂傛牞绶崳銊ゅ瘜瀵湱鐛?
     ============================================================ -->
<div class="editor-modal">

  <!-- Z-INDEX 4: 妞ゅ爼鍎寸€佃壈鍩呴弽?-->
  <div class="top-bar">
    <button class="icon-btn btn-back" title="重新导入" onclick="reImportCurrent()"></button>

    <button class="icon-btn btn-warn" title="警告">!</button>
    <span class="warn-text">注意：严禁出现与国家法律法规及政策相抵触的内容</span>

    <span class="doc-name">Exhibition Gallery.indd</span>

    <div class="btn-group">
      <button class="icon-btn btn-delete" title="删除画布" onclick="clearCanvas()">🗑</button>
      <button class="icon-btn btn-undo" title="撤销 (Ctrl+Z)" onclick="undo()">↩</button>
      <button class="icon-btn btn-save-icon" title="导入图片" onclick="document.getElementById('importFileInput').click()">📁</button>
      <span class="btn-save-label" onclick="document.getElementById('importFileInput').click()" style="cursor:pointer">导入</span>
      <input type="file" id="importFileInput" accept="image/*" style="display:none" onchange="startImport(event)">

      <button class="icon-btn" title="手动存档" onclick="manualSave()" style="background:#222;">💾</button>

      <button class="btn-primary" onclick="toggleExportDropdown(event)">
        <span class="check-icon">✓</span>
        <span>完成并导出 ▾</span>
      </button>
    </div>
  </div>

  <!-- Z-INDEX 5: 娑撳鐖敮鍐ㄧ湰 -->
  <div class="editor-body">

    <!-- 瀹革附鐖敍姘嚤閼割亜娅?20% -->
    <div class="left-panel">
      <div class="nav-title">
        <span class="nav-icon">🧭</span>
        <span>导航器</span>
      </div>
      <div class="nav-preview-wrap">
        <canvas id="navPreview" width="128" height="128"></canvas>
      </div>

      <!-- 吸管取色弹窗 -->
      <div class="color-pick-popup" id="colorPickPopup">
        <div class="pick-top">
          <div class="pick-swatch" id="pickSwatch"></div>
          <div class="pick-info" id="pickInfo"></div>
        </div>
        <div class="pick-divider"></div>
        <div class="pick-bottom">
          <span class="pick-bottom-label">近似色</span>
          <div class="pick-options" id="pickOptions"></div>
        </div>
      </div>

      <div class="zoom-slider-wrap" id="zoomSliderWrap">
        <span class="zoom-label">缩放视图</span>
        <input type="range" class="zoom-slider" id="zoomSlider"
               min="20" max="300" value="100" oninput="setZoom(this.value)">
        <span class="zoom-value" id="zoomValue">100%</span>
      </div>
      <!-- 移动端缩放按钮（桌面端隐藏） -->
      <div class="zoom-btns-mobile" id="zoomBtnsMobile">
        <button class="zoom-mb-btn" onclick="adjustZoom(10)" title="放大">+</button>
        <span class="zoom-value" id="zoomValueMb">100%</span>
        <button class="zoom-mb-btn" onclick="adjustZoom(-10)" title="缩小">−</button>
      </div>

      <!-- 閻㈣绔?鐎电厧鍙嗛崶鎯у瀼閹?-->
      <!-- 参考图叠加 (导入图片后显示) -->
      <div id="overlayControls" style="display:none;">
        <div style="display:flex;align-items:center;gap:6px;width:100%;">
          <button id="overlayToggleBtn" onclick="toggleOverlay()"
                  style="flex:1;padding:6px;background:#444;border:none;border-radius:4px;color:#aaa;font-size:11px;cursor:pointer;letter-spacing:1px;">参考图 OFF</button>
        </div>
        <div style="display:flex;align-items:center;gap:6px;width:100%;">
          <span style="color:#aaa;font-size:10px;">透明度</span>
          <input type="range" id="overlayOpacity" min="10" max="90" value="40" style="flex:1;height:4px;"
                 oninput="updateOverlayOpacity(this.value)">
          <span style="color:#aaa;font-size:10px;" id="overlayOpacityVal">40%</span>
        </div>
      </div>

      <button class="nav-toggle-btn" id="navToggleBtn" onclick="toggleViewMode()" disabled>
        <span id="navToggleLabel">查看像素</span>
      </button>
    </div>

    <!-- 娑擃厽鐖敍姘辨暰鐢?60% -->
    <div class="center-panel" id="centerPanel">
      <div class="canvas-container" id="canvasContainer">
        <div style="position:relative;flex-shrink:0;line-height:0;">
        <canvas id="pixelCanvas"></canvas>
          <canvas id="overlayCanvas" style="position:absolute;top:0;left:0;pointer-events:none;display:none;z-index:3;"></canvas>
        </div>
      </div>
      <div class="grid-info" id="gridInfo">24 × 24 px</div>
    </div>

    <!-- 閸欒櫕鐖敍姘额杹閺傛瑥浼愰崗?20% -->
    <div class="right-panel">
      <div class="tool-icons">
        <button class="tool-icon-btn" title="撤销" onclick="undo()">↩</button>
        <button class="tool-icon-btn" title="重做" onclick="redo()">↪</button>
        <button class="tool-icon-btn active" id="brushTool" title="画笔" onclick="setTool('brush')">🖌</button>
        <button class="tool-icon-btn" id="eraserTool" title="橡皮" onclick="setTool('eraser')">◻</button>
        <button class="tool-icon-btn" id="inspectTool" title="吸管" onclick="setTool('inspect')">💉</button>
      </div>

      <!-- 色板选择下拉 -->
      <div class="palette-picker" id="palettePicker">
        <button class="palette-picker-btn" id="palettePickerBtn" onclick="togglePalettePicker()">
          <span id="palettePickerLabel">色板: 巡展像素</span>
          <span class="picker-arrow">▾</span>
        </button>
        <div class="palette-picker-menu" id="palettePickerMenu" style="display:none;"></div>
      </div>

      <!-- 当前色显示 & 颜色预览 -->
      <div class="color-display" id="colorDisplay">
        <div class="color-display-swatch" id="colorSwatch" style="background:#000000"></div>
        <div class="color-display-text">
          <div class="color-display-label" id="colorLabel">当前色</div>
          <div class="color-display-info" id="colorInfo">RGB(0, 0, 0)<br>#000000</div>
        </div>
      </div>
      <div class="color-usage-summary" id="colorUsageSummary">已用颜色 0 种 · 已绘制 0 格</div>
      <div class="conversion-result-summary" id="conversionResultSummary">当前画布 · 未关联转换版本</div>

      <div class="color-grid" id="colorGrid">
        <!-- JS閸斻劍鈧胶鏁撻幋?-->
      </div>

      <button class="more-colors-btn" title="换一批颜色" onclick="cyclePalette()">↻</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- 鐟佷礁澹€瀵湱鐛?-->
<div class="crop-overlay" id="cropOverlay">
  <div class="crop-modal">
    <div class="crop-title">导入图片 & 裁切预览</div>
    <div class="crop-viewport" id="cropViewport">
      <img id="cropImage" draggable="false" style="display:none">
    </div>
    <div class="crop-controls">
      <span class="crop-zoom-label">缩放</span>
      <input type="range" class="crop-zoom-slider" id="cropZoomSlider" min="10" max="500" value="100" oninput="updateCropZoom(this.value)">
      <span class="crop-zoom-label" id="cropZoomVal">100%</span>
      <span class="crop-zoom-label">格数</span>
      <button class="grid-size-btn active" id="gridBtn24" onclick="setCropGridSize(24, this)">24</button>
      <button class="grid-size-btn" id="gridBtn52" onclick="setCropGridSize(52, this)">52</button>
      <button class="grid-size-btn" id="gridBtn104" onclick="setCropGridSize(104, this)">104</button>
    </div>
    <div class="crop-controls">
      <span class="crop-zoom-label">转换方式</span>
      <select id="conversionMode" class="conversion-mode-select" onchange="updateConversionModeUI()">
        <option value="server" selected>服务器 Pyxelate（推荐）</option>
        <option value="local">浏览器本地备用</option>
      </select>
    </div>
    <div class="crop-controls">
      <span id="localColorOptions" style="display:none;align-items:center;gap:8px;">
        <span class="crop-zoom-label">本地颜色数</span>
        <input type="range" class="crop-zoom-slider" id="cropColorCount" min="4" max="64" value="32" oninput="document.getElementById('cropColorVal').textContent=this.value">
        <span class="crop-zoom-label" id="cropColorVal">32</span>
      </span>
      <span class="crop-zoom-label">抖动</span>
      <select id="cropDither" onchange="updateConversionModeUI()" style="font-size:11px;padding:2px 4px;border:1px solid #ccc;border-radius:3px;background:#fff;color:#333;cursor:pointer;">
        <option value="none" selected>无（推荐）</option>
        <option value="floyd">Floyd-Steinberg</option>
        <option value="atkinson">Atkinson</option>
      </select>
    </div>
    <div class="conversion-note" id="conversionNote">裁切图将上传到本机 API，原图不会持久保存。</div>
    <div class="conversion-status" id="conversionStatus" role="status" aria-live="polite">
      <span class="conversion-spinner"></span>
      <span id="conversionStatusText">正在转换…</span>
      <button class="conversion-cancel-btn" id="conversionCancelBtn" onclick="cancelConversion()">取消请求</button>
      <button class="conversion-retry-btn" id="conversionRetryBtn" onclick="confirmCrop()">重新尝试</button>
    </div>
    <div class="crop-btns">
      <button class="crop-btn crop-btn-cancel" onclick="cancelCrop()">取消</button>
      <button class="crop-btn crop-btn-confirm" id="confirmCropBtn" onclick="confirmCrop()">确认裁切并转换</button>
    </div>
  </div>
</div>

<script src="/static/js/storage.js"></script>
<script src="/static/js/conversion-api.js"></script>
<script src="/static/js/state.js"></script>
<script src="/static/js/editor.js"></script>
<script src="/static/js/export.js"></script>
<script src="/static/js/import.js"></script>
<script src="/static/js/app.js"></script>

<!-- 导出下拉列表（body层级，避免被层叠上下文遮盖） -->
<div class="export-dropdown" id="exportDropdown">
  <button class="export-item" onclick="exportRawPixelImage()">
    <span>🖼</span> 导出原始尺寸 PNG
  </button>
  <button class="export-item" onclick="exportPixelPreview()">
    <span>🔍</span> 导出最近邻放大图
  </button>
  <div class="export-divider"></div>
  <div id="exportBeadSection">
    <button class="export-item" id="exportBeadBtn" onclick="exportBeadBlueprint()">
      <span>📿</span> 导出拼豆图纸
    </button>
    <div class="export-warning" id="exportWarning" style="display:none;">当前使用的为非拼豆色卡，请返回并切换后再导出</div>
  </div>
</div>


<!-- 移动端竖屏提示 -->
<div class="rotate-hint" id="rotateHint">
  <div class="rotate-icon">📱↺</div>
  <div class="rotate-text">请横屏使用</div>
  <div class="rotate-sub">旋转手机以获得最佳体验</div>
</div>

</body>
</html>
